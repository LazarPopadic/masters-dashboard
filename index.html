<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!-- Discourage the browser from holding a stale copy of this page. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Master's Dashboard</title>
  <!-- PWA: installable home-screen app (iOS reads the apple-* tags + touch icon) -->
  <link rel="manifest" href="manifest.webmanifest?v=12">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=12">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=12">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=12">
  <meta name="theme-color" content="#0e1013">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Masters">
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>

  <!-- ======================= LOCK SCREEN ======================= -->
  <!-- Hidden by default; app.js reveals it only when the password lock is on. -->
  <div id="lock" class="lock" hidden>
    <div class="lock-card">
      <div class="lock-mark"><svg class="mark-icon" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Graduation cap"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3 1 9l11 6 9-4.91V17h2V9L12 3z"/></svg></div>
      <h1>Master's Dashboard</h1>
      <p class="lock-sub">Private. Enter the password to unlock.</p>
      <form id="lock-form">
        <input type="password" id="lock-pass" placeholder="Password" autocomplete="current-password" autofocus>
        <label class="lock-remember">
          <input type="checkbox" id="lock-remember"> Remember on this device
        </label>
        <button type="submit" id="lock-btn">Unlock</button>
        <p id="lock-error" class="lock-error" hidden>Wrong password — try again.</p>
      </form>
    </div>
  </div>

  <!-- ======================= APP SHELL ======================= -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-title">
        <span class="topbar-mark"><svg class="mark-icon" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Graduation cap"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3 1 9l11 6 9-4.91V17h2V9L12 3z"/></svg></span>
        <span>Master's Dashboard</span>
        <span class="topbar-date" id="topbar-date"></span>
      </div>
      <div class="topbar-actions">
        <button id="btn-export" class="ghost" title="Download your statuses, notes and checkmarks as a backup file">Export</button>
        <button id="btn-import" class="ghost" title="Restore from a backup file">Import</button>
        <input type="file" id="import-file" accept=".json" hidden>
        <button id="btn-lock" class="ghost" title="Lock the dashboard on this device">Lock</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="overview" class="tab active">Overview</button>
      <button data-tab="programs" class="tab">Programmes</button>
      <button data-tab="reserves" class="tab">Reserves</button>
      <button data-tab="compare" class="tab">Compare</button>
      <button data-tab="cities" class="tab">Cities</button>
      <button data-tab="timeline" class="tab">Timeline</button>
      <button data-tab="checklist" class="tab">Checklist</button>
      <button data-tab="summer" class="tab">Summer 2026</button>
      <button data-tab="profile" class="tab">Profile</button>
      <button data-tab="strategy" class="tab">Strategy</button>
    </nav>

    <main id="main"></main>

    <footer class="footer">
      <p id="footer-note"></p>
    </footer>
  </div>

  <script src="js/crypto.js?v=12"></script>
  <script src="js/data.encrypted.js?v=12"></script>
  <script src="js/app.js?v=12"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
